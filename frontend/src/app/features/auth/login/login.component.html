<div class="login-page">
  <p-card styleClass="login-card">
    <ng-template pTemplate="title">ScrumBoard</ng-template>
    <ng-template pTemplate="subtitle">Inicia sesión para gestionar el tablero</ng-template>

    @if (error) {
      <p-message severity="error" [text]="error" styleClass="w-full mb-3"></p-message>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
      <label for="email">Correo</label>
      <input id="email" pInputText formControlName="email" class="w-full" autocomplete="username" />

      <label for="password">Contraseña</label>
      <p-password
        inputId="password"
        formControlName="password"
        [feedback]="false"
        [toggleMask]="true"
        styleClass="w-full"
        inputStyleClass="w-full"
        autocomplete="current-password"
      />

      <button pButton type="submit" label="Entrar" icon="pi pi-sign-in" class="w-full" [loading]="loading"></button>
    </form>

    <p class="hint">Usuarios semilla: admin&#64;ideasgroup.test / Admin123* · dev&#64;ideasgroup.test / Dev123*</p>
  </p-card>
</div>
